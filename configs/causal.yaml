# Causal Analysis Configuration
# Canonical source for all parameters used by CausalAnalysisAgent and Notebook 05.

n_bootstrap: 1000
min_treated: 20
random_seed: 42

# PSM is run on PPO data only. BC model records are excluded before analysis.
ppo_only: true

# Treatments are organized into two tiers.
# Primary treatments compare sensor suites; Rosenbaum sensitivity bounds are
# applied only to these because they make the core claim of the experiment.
# Secondary treatments study condition effects within the PPO data.
#
# Confounders available in eval records: weather, town (road_type and traffic
# density are not tracked per episode and are therefore not included).

primary_treatments:
  # Single-camera (control) vs. multi-camera (treated)
  - name: sensor_single_vs_multi
    outcome: route_completion
    treated_condition:
      field: sensor_suite
      op: eq
      value: multi_cam
    control_condition:
      field: sensor_suite
      op: eq
      value: single_cam
    covariates: [weather_code, town_code]
    rosenbaum: true

  # Single-camera (control) vs. lidar (treated)
  - name: sensor_single_vs_lidar
    outcome: route_completion
    treated_condition:
      field: sensor_suite
      op: eq
      value: lidar
    control_condition:
      field: sensor_suite
      op: eq
      value: single_cam
    covariates: [weather_code, town_code]
    rosenbaum: true

  # Multi-camera (control) vs. lidar (treated)
  - name: sensor_multi_vs_lidar
    outcome: route_completion
    treated_condition:
      field: sensor_suite
      op: eq
      value: lidar
    control_condition:
      field: sensor_suite
      op: eq
      value: multi_cam
    covariates: [weather_code, town_code]
    rosenbaum: true

secondary_treatments:
  # Effect of rain on route completion (within PPO data)
  - name: rain
    outcome: route_completion
    treated_condition:
      field: weather
      op: eq
      value: HardRainNoon
    control_condition:
      field: weather
      op: eq
      value: ClearNoon
    covariates: [sensor_suite_code, town_code]
    rosenbaum: false

  # Effect of night driving on route completion
  - name: night
    outcome: route_completion
    treated_condition:
      field: weather
      op: eq
      value: ClearNight
    control_condition:
      field: weather
      op: eq
      value: ClearNoon
    covariates: [sensor_suite_code, town_code]
    rosenbaum: false

  # Effect of aggressive driving style (hurry) vs. smooth (chill)
  - name: style_hurry_vs_chill
    outcome: route_completion
    treated_condition:
      field: driving_style
      op: eq
      value: hurry
    control_condition:
      field: driving_style
      op: eq
      value: chill
    covariates: [weather_code, sensor_suite_code, town_code]
    rosenbaum: false

# Difference-in-Differences comparisons.
# "pre" period = BC model; "post" period = PPO model.
# DiD = (PPO_treated - BC_treated) - (PPO_control - BC_control)
# Answers: did PPO fine-tuning help the treated suite *more* than the control?
# Parallel-trends assumption: without PPO, both suites would have improved equally.
did_comparisons:
  - name: did_multi_vs_single
    treated_suite: multi_cam
    control_suite: single_cam
  - name: did_lidar_vs_single
    treated_suite: lidar
    control_suite: single_cam
  - name: did_lidar_vs_multi
    treated_suite: lidar
    control_suite: multi_cam
